name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR=""

          if [ -f "./settings.gradle" ]; then
            PROJECT_DIR="."
          elif [ -f "./settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR=$(find . \
              -path "./gradle-8.9" -prune -o \
              -path "./.git" -prune -o \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Android Gradle project not found."
              echo "Top-level repository contents:"
              ls -la
              echo ""
              echo "Directories:"
              find . -maxdepth 3 -type d \
                ! -path "./.git*" \
                ! -path "./gradle-8.9*" | sort
              exit 1
            fi
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project
        run: |
          echo "Project directory: $PROJECT_DIR"
          echo ""
          ls -la "$PROJECT_DIR"
          echo ""
          echo "settings.gradle:"
          ls -l "$PROJECT_DIR"/settings.gradle* 2>/dev/null || true
          echo ""
          echo "app directory:"
          ls -la "$PROJECT_DIR/app" 2>/dev/null || true

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/app/build/outputs/apk/debug/app-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruview-android-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
